version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: udyamsaarthi-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: udyamsaarthi-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/udyamsaarthi
      - ML_SERVICE_URL=http://ml_service:8000
      - JWT_SECRET=change_this_to_a_long_random_string
    depends_on:
      - mongo
      - ml_service

  ml_service:
    build: ./ml_service
    container_name: udyamsaarthi-ml-service
    ports:
      - "8000:8000"

  client:
    build: ./client
    container_name: udyamsaarthi-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - server

volumes:
  mongo_data:
